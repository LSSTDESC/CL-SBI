[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaklensclustersbi"
version = "0.1.0"
description = "Weak Lensing Galaxy Clusters using Simulation Based Inference"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "LSST-DESC", email = "lsst-desc@slac.stanford.edu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "weak lensing",
    "galaxy clusters",
    "simulation based inference",
    "cosmology",
    "MCMC",
    "neural density estimation",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "torch>=1.9.0",
    "sbi>=0.22.0",
    "emcee>=3.1.0",
    "colossus>=1.3.0",
    "matplotlib>=3.5.0",
    "chainconsumer>=1.0.0",
    "pygtc>=0.4.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "numpydoc>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/LSSTDESC/CL-SBI"
Documentation = "https://cl-sbi.readthedocs.io"
Repository = "https://github.com/LSSTDESC/CL-SBI"
Issues = "https://github.com/LSSTDESC/CL-SBI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["weaklensclustersbi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "docs/",
    "adhoc/",
    "scripts/",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "docs/",
    "adhoc/",
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["weaklensclustersbi"]
